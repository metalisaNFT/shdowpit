name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test:unit

      - run: npm run lint

      - run: npm run test:ci
